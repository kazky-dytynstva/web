  <style>
    #app-loading{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;
      justify-content:center;background:#0A1921}
    .app-loading__bar{position:relative;width:200px;height:4px;border-radius:2px;
      background:rgba(255,255,255,.15);overflow:hidden}
    .app-loading__bar::before{content:"";position:absolute;top:0;left:0;height:100%;width:40%;
      border-radius:2px;background:#fff;animation:app-loading-slide 1.1s ease-in-out infinite}
    @keyframes app-loading-slide{0%{left:-40%}100%{left:100%}}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
      clip:rect(0,0,0,0);white-space:nowrap;border:0}
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
