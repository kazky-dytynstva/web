<!DOCTYPE html>
<html lang="uk">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Казки дитинства — безкоштовний застосунок з великою бібліотекою казок, віршів та колискових українською мовою. Читайте та слухайте разом з дітьми.">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://kazky.net">
  <meta property="og:title" content="Казки дитинства — безкоштовні казки для дітей">
  <meta property="og:description" content="Безкоштовний застосунок з бібліотекою казок, віршів та колискових. Текстові та аудіо формати. Працює без інтернету. Зроблено з ❤️ до України.">
  <meta property="og:image" content="https://kazky.net/assets/web/og-image.webp">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Казки дитинства — безкоштовні казки для дітей">
  <meta name="twitter:description" content="Безкоштовний застосунок з бібліотекою казок, віршів та колискових українською.">
  <meta name="twitter:image" content="https://kazky.net/assets/web/og-image.webp">

  <!-- Canonical -->
  <link rel="canonical" href="https://kazky.net">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Казки дитинства">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Казки дитинства — безкоштовні казки для дітей</title>
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0A1921">
  <link rel="manifest" href="manifest.json">

  <!-- Structured data for search engines -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "MobileApplication",
    "name": "Казки дитинства",
    "operatingSystem": "iOS, Android",
    "applicationCategory": "EducationalApplication",
    "inLanguage": "uk",
    "description": "Безкоштовний застосунок з великою бібліотекою українських казок, віршів та колискових у текстовому та аудіо форматах. Працює без інтернету.",
    "url": "https://kazky.net",
    "image": "https://kazky.net/assets/web/og-image.webp",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "UAH" },
    "author": { "@type": "Organization", "name": "Казки дитинства" },
    "downloadUrl": [
      "https://apps.apple.com/us/app/казки-дитинства/id1513020180",
      "https://play.google.com/store/apps/details?id=ua.andriyantonov.tales"
    ]
  }
  </script>
</head>
<body>
  <!-- SEO / no-JS fallback + loading splash (removed once Flutter renders its first frame) -->
  <div id="app-loading">
    <img src="favicon.png" width="72" height="72" alt="Казки дитинства" class="app-loading__logo">
    <h1 class="app-loading__title">Казки дитинства</h1>
    <p class="app-loading__desc">Безкоштовний застосунок з великою бібліотекою українських казок, віршів та
      колискових у текстовому та аудіо форматах. Працює без інтернету.</p>
    <p class="app-loading__stores">
      <a href="https://apps.apple.com/us/app/казки-дитинства/id1513020180">App Store</a>
      <span aria-hidden="true">·</span>
      <a href="https://play.google.com/store/apps/details?id=ua.andriyantonov.tales">Google Play</a>
    </p>
    <div class="app-loading__spinner" aria-hidden="true"></div>
  </div>

  <style>
    #app-loading{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;
      justify-content:center;text-align:center;padding:24px;background:#0A1921;color:#fff;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
    .app-loading__logo{border-radius:16px;margin-bottom:16px}
    .app-loading__title{font-size:1.4rem;font-weight:600;margin:0 0 8px}
    .app-loading__desc{max-width:520px;opacity:.75;margin:0 0 16px;line-height:1.5}
    .app-loading__stores a{color:#fff;text-decoration:underline;margin:0 6px}
    .app-loading__spinner{width:28px;height:28px;margin-top:20px;border:3px solid rgba(255,255,255,.25);
      border-top-color:#fff;border-radius:50%;animation:app-loading-spin 1s linear infinite}
    @keyframes app-loading-spin{to{transform:rotate(360deg)}}
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-loading');
      if (el) el.remove();
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
