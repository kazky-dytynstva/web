<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Переходимо...</title>
  <link rel="icon" href="../assets/images/android-foreground-1.png" type="image/png">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

<div class="tracker-page">
  <div class="tracker-page__inner">
    <div class="tracker-spinner" aria-hidden="true"></div>
    <p class="tracker-page__text">Переходимо до застосунку...</p>
  </div>
</div>

<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var ref = params.get('ref');
  var data = {
    ref: ref,
    screen_w: window.screen.width * window.devicePixelRatio,
    screen_h: window.screen.height * window.devicePixelRatio,
    lang: navigator.language || navigator.userLanguage,
    platform: navigator.platform
  };
  var FUNCTION_URL = "https://acduudzajvhtbophynwx.supabase.co/functions/v1/click-handler"\;
  fetch(FUNCTION_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  })
  .then(function(res) { return res.json(); })
  .then(function(response) {
    if (response.url) window.location.href = response.url;
  })
  .catch(function() {
    window.location.href = "https://play.google.com/store/apps/details?id=ua.andriyantonov.tales"\;
  });
})();
</script>

</body>
</html>
